services:
  db:
    image: postgres:15-alpine
    container_name: tarot-db
    environment:
      POSTGRES_USER: sergio
      POSTGRES_PASSWORD: tarot_password
      POSTGRES_DB: tarot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  tarot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tarot-app
    ports:
      - "4025:4025"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4025
      - HOSTNAME=0.0.0.0
    restart: unless-stopped

volumes:
  pgdata:
